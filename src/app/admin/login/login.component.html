<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Saptathi Portal</h2>
      <p>Please enter your login details to access the account.</p>
    </div>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-container">
          <i class="material-icons">person</i>
          <input 
            type="text" 
            id="username" 
            formControlName="username"
            class="form-control"
            placeholder="Enter your username"
            [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
        </div>
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="error-message">
          Please enter a valid username
        </div>
      </div>

      <div class="form-group">
        <div class="password-label-container">
          <label for="password">Password</label>
          <!-- <a routerLink="/forgot-password" class="forgot-password">Forgot Password?</a> -->
        </div>
        <div class="input-container" [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <i class="material-icons">lock</i>
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            formControlName="password"
            class="form-control"
            placeholder="Enter your password"
            (blur)="loginForm.get('password')?.markAsTouched()"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <button type="button" class="toggle-password" (click)="togglePassword()" tabindex="-1">
            <i class="material-icons">{{ showPassword ? 'visibility_off' : 'visibility' }}</i>
          </button>
        </div>
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error-messages">
          <div *ngFor="let error of getPasswordErrors()" class="error-message">
            {{ error }}
          </div>
        </div>
      </div>

      <!-- <div class="form-group remember-me">
        <label class="checkbox-container">
          <input type="checkbox" formControlName="rememberMe">
          <span class="checkmark"></span>
          Remember me
        </label>
      </div> -->

      <button type="submit" class="login-button" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
      
      <!-- <div class="signup-link">
        Don't have an account? <a routerLink="/signup">Sign up</a>
      </div> -->
    </form>
  </div>
</div>
