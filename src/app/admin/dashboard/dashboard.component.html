<div class="dashboard-container">
  <div class="logout-container">
    <button class="logout-button" (click)="logout()">
      <i class="material-icons">logout</i>
      <span>Logout</span>
    </button>
  </div>
  <h1>Welcome to Admin Dashboard</h1>
  <div class="button-grid">
    <button class="action-button" (click)="onOnSpotRegistration()">
      <i class="material-icons">person_add</i>
      <span>On-Spot Registration</span>
    </button>
    <button class="action-button" (click)="onAttendanceManagement()">
      <i class="material-icons">groups</i>
      <span>Attendance Management</span>
    </button>
    <button class="action-button" (click)="onQRScanAttendance()">
      <i class="material-icons">qr_code_scanner</i>
      <span>QR Scan for Attendance</span>
    </button>
    <button class="action-button" (click)="onQRScanGifts()">
      <i class="material-icons">redeem</i>
      <span>QR Scan for Gifts</span>
    </button>
      </div>
</div>
